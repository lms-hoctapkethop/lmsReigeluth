# Học cùng nhau · CI (cổng G1/G2 ở docs/09 mục 10)
name: ci
# Node 26 is the target after LTS (docs/02). M0 runs on 22 until that upgrade.
on:
  pull_request:
  push:
    branches: [main, m1-auth, m2-org, m3-curriculum, m4-authoring, chore/m4-close, m5-learning, m6-quiz, m7-review, m8-insight]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Spec files unchanged
        run: sha256sum -c db/SPEC_SHA256SUMS
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --prod --audit-level high
      # gitleaks-action@v2 đòi giấy phép khi repo thuộc tổ chức và dừng trước khi quét.
      # SEC-20 dùng CLI mã nguồn mở, cùng luật, có gitleaks.toml cho ví dụ trong đặc tả.
      - name: gitleaks (SEC-20)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --redact --config gitleaks.toml

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: hcn }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hcn?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Install dbmate 2.28.0
        run: |
          curl -fsSL -o /tmp/dbmate-linux-amd64 https://github.com/amacneil/dbmate/releases/download/v2.28.0/dbmate-linux-amd64
          echo "4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c  /tmp/dbmate-linux-amd64" | sha256sum -c -
          install -m 755 /tmp/dbmate-linux-amd64 /usr/local/bin/dbmate
      - name: Migrate up, down all, up again
        run: |
          dbmate --migrations-dir db/migrations --no-dump-schema up
          for i in $(ls db/migrations | wc -l | xargs seq); do dbmate --migrations-dir db/migrations --no-dump-schema down; done
          dbmate --migrations-dir db/migrations --no-dump-schema up
      - name: Schema invariants (DB01–DB46)
        shell: bash
        run: |
          set -o pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/schema_invariants.sql 2>&1 | tee invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/curriculum_review_invariants.sql 2>&1 | tee -a invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/learning_invariants.sql 2>&1 | tee -a invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/quiz_invariants.sql 2>&1 | tee -a invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/file_guards_invariants.sql 2>&1 | tee -a invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/review_guards_invariants.sql 2>&1 | tee -a invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/insight_guards_invariants.sql 2>&1 | tee -a invariants.log
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/ops_invariants.sql 2>&1 | tee -a invariants.log
          test "$(grep -c 'PASS' invariants.log)" -ge 116

  unit-integration:
    runs-on: ubuntu-24.04
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - name: Install dbmate 2.28.0
        run: |
          curl -fsSL -o /tmp/dbmate-linux-amd64 https://github.com/amacneil/dbmate/releases/download/v2.28.0/dbmate-linux-amd64
          echo "4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c  /tmp/dbmate-linux-amd64" | sha256sum -c -
          install -m 755 /tmp/dbmate-linux-amd64 /usr/local/bin/dbmate
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Reference vectors (must stay 39/39)
        run: node tests/reference/pure.reference.mjs
      - name: Unit + integration (Testcontainers postgres:18)
        run: |
          mkdir -p reports
          set -o pipefail
          pnpm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml --coverage 2>&1 | tee reports/vitest.log
      - name: Tóm tắt lỗi thành annotation (log job không phải ai cũng tải được)
        if: failure()
        run: |
          grep -nE "FAIL|Error|×|✗|failed|Timeout|ECONN|exit code" reports/vitest.log | tail -n 40 | while IFS= read -r line; do echo "::error title=vitest::${line}"; done
          tail -n 15 reports/vitest.log | while IFS= read -r line; do echo "::error title=vitest-tail::${line}"; done
      - name: OpenAPI in sync with contracts
        run: pnpm openapi:check
      - name: Breaking API changes
        # oasdiff (kin-openapi) không đọc được OpenAPI 3.1 của repo và thoát mã 121 ngay khi nạp tệp;
        # bước này chưa từng chạy trước PR đầu tiên trên GitHub. Thay bằng script kiểm các thay đổi phá vỡ chính.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-api')
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:openapi/openapi.yaml > /tmp/base.yaml || exit 0
          node scripts/openapi-breaking.mjs /tmp/base.yaml openapi/openapi.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-integration-reports, path: reports/ }

  build:
    runs-on: ubuntu-24.04
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle budget route /hoc < 250 KB gzip (NFR-08)
        run: pnpm --filter web run size-check
      - name: Built assets do not contain the answer sentinel (SEC-08)
        run: node apps/web/scripts/answer-leak-scan.mjs

  e2e:
    runs-on: ubuntu-24.04
    needs: [unit-integration, build, database]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hcn?sslmode=disable
      OIDC_ISSUER: http://localhost:8081/realms/hcn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install dbmate 2.28.0
        run: |
          curl -fsSL -o /tmp/dbmate-linux-amd64 https://github.com/amacneil/dbmate/releases/download/v2.28.0/dbmate-linux-amd64
          echo "4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c  /tmp/dbmate-linux-amd64" | sha256sum -c -
          install -m 755 /tmp/dbmate-linux-amd64 /usr/local/bin/dbmate
      - run: docker compose -f deploy/compose.dev.yml up -d --wait
      - name: Wait for Keycloak issuer
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/realms/hcn/.well-known/openid-configuration && exit 0
            sleep 2
          done
          exit 1
      - run: pnpm db:migrate && pnpm db:seed:test
      - name: Login role thuộc hcn_worker
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'hcn_e2e_worker') THEN
              CREATE ROLE hcn_e2e_worker LOGIN PASSWORD 'hcn_e2e_worker' IN ROLE hcn_worker;
            END IF;
          END
          $$;
          SQL
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --reporter=github,list,html
        env:
          WORKER_DATABASE_URL: postgres://hcn_e2e_worker:hcn_e2e_worker@localhost:5432/hcn?sslmode=disable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  deploy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck, hadolint, compose config, policy-check
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          sudo install -m 755 /tmp/hadolint /usr/local/bin/hadolint
          shellcheck deploy/staging/bin/hcn-staging deploy/staging/bin/*.sh deploy/staging/*.sh deploy/staging/test/*.sh deploy/staging/host-proxy/*.sh deploy/keycloak/kc-entrypoint.sh tests/resilience/*.sh
          hadolint deploy/api/Dockerfile deploy/web/Dockerfile
          bash deploy/staging/test/entry.test.sh
          bash deploy/staging/test/policy-check.test.sh
          bash deploy/staging/test/preflight.test.sh
          bash deploy/staging/test/workflow.test.sh
          bash deploy/staging/test/render.test.sh
          bash deploy/staging/test/perf-scripts.test.sh
          bash deploy/staging/test/x01-x07.test.sh

  resilience:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Chỉ chạy khi đổi deploy, worker hoặc plugin
        id: gate
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -Eq '^(deploy/|apps/worker/|apps/api/src/plugins/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: 22, cache: pnpm }
      - name: Install dbmate 2.28.0
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsSL -o /tmp/dbmate-linux-amd64 https://github.com/amacneil/dbmate/releases/download/v2.28.0/dbmate-linux-amd64
          echo "4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c  /tmp/dbmate-linux-amd64" | sha256sum -c -
          install -m 755 /tmp/dbmate-linux-amd64 /usr/local/bin/dbmate
      - name: Cài phụ thuộc
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: REL-02
        if: steps.gate.outputs.run == 'true'
        run: bash tests/resilience/rel-02.sh
      - name: REL-01 REL-03 REL-04
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec vitest run apps/api/test/resilience.test.ts
        env:
          HCN_RESILIENCE: "1"
          HCN_REL01_SECONDS: "600"
