# Học cùng nhau · CI (cổng G1/G2 ở docs/09 mục 10)
name: ci
# Node 26 is the target after LTS (docs/02). M0 runs on 22 until that upgrade.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm audit --prod --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: hcn }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hcn?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Install dbmate
        run: curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64 && chmod +x /usr/local/bin/dbmate
      - name: Migrate up, down all, up again
        run: |
          dbmate --migrations-dir db/migrations --no-dump-schema up
          for i in $(ls db/migrations | wc -l | xargs seq); do dbmate --migrations-dir db/migrations --no-dump-schema down; done
          dbmate --migrations-dir db/migrations --no-dump-schema up
      - name: Schema invariants (DB01–DB16)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/schema_invariants.sql 2>&1 | tee invariants.log
          test "$(grep -c 'PASS' invariants.log)" -ge 26

  unit-integration:
    runs-on: ubuntu-24.04
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Reference vectors (must stay 37/37)
        run: node tests/reference/pure.reference.mjs
      - name: Unit + integration (Testcontainers postgres:18)
        run: pnpm test -- --reporter=junit --outputFile=reports/vitest.xml --coverage
      - name: OpenAPI in sync with contracts
        run: pnpm openapi:check
      - name: Breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:openapi/openapi.yaml > /tmp/base.yaml || exit 0
          docker run --rm -v /tmp:/tmp -v $PWD:/w tufin/oasdiff breaking /tmp/base.yaml /w/openapi/openapi.yaml --fail-on ERR
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-integration-reports, path: reports/ }

  build:
    runs-on: ubuntu-24.04
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle budget route /hoc < 250 KB gzip (NFR-08)
        run: pnpm --filter web run size-check

  e2e:
    runs-on: ubuntu-24.04
    needs: [unit-integration, build, database]
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f deploy/compose.dev.yml up -d --wait
      - run: pnpm db:migrate && pnpm db:seed:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report/ }
