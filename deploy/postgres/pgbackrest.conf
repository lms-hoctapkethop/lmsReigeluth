[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=6
# repo2: kho ngoài máy (S3-compatible). Khóa đặt qua biến môi trường PGBACKREST_REPO2_S3_KEY / _KEY_SECRET.
repo2-type=s3
repo2-path=/hcn
repo2-s3-bucket=hcn-backup
repo2-s3-endpoint=s3.example.vn
repo2-s3-region=hn
repo2-retention-full=8
repo2-cipher-type=aes-256-cbc
process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail
archive-async=y
spool-path=/var/spool/pgbackrest

[hcn]
pg1-path=/var/lib/postgresql/18/docker
