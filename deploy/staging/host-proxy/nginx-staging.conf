# Mẫu. Ops chép thành một tệp mới, nginx -t, rồi reload.
# Không sửa khối của lms.hoctapkethop.edu.vn.
# Danh sách set_real_ip_from lấy từ https://www.cloudflare.com/ips-v4 và ips-v6 lúc cài.

server {
  listen 443 ssl;
  server_name staging-lms.hoctapkethop.edu.vn id-staging-lms.hoctapkethop.edu.vn;
  ssl_certificate /etc/ssl/hcn-staging/origin.pem;
  ssl_certificate_key /etc/ssl/hcn-staging/origin.key;

  # set_real_ip_from <dải Cloudflare>;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 30m;
  proxy_read_timeout 60s;

  location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
