name: deploy-staging
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA cần triển khai
        required: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: staging
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Bỏ qua khi ops chưa cấu hình SSH
        id: gate
        run: |
          if [[ -z "${{ secrets.STAGING_SSH_HOST }}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Environment staging chưa có STAGING_SSH_HOST. Xem docs/ops/staging-runbook.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.gate.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Dựng ba image
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sha="${DEPLOY_SHA}"
          docker buildx build --load -f deploy/api/Dockerfile -t "hcn/api:${sha}" .
          docker buildx build --load -f deploy/web/Dockerfile -t "hcn/web:${sha}" .
          docker buildx build --load -f deploy/postgres/Dockerfile -t "hcn/postgres:18-${sha}" deploy
      - name: Trivy
        id: trivy
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          sha="${DEPLOY_SHA}"
          mkdir -p trivy-reports
          for image in "hcn/api:${sha}" "hcn/web:${sha}" "hcn/postgres:18-${sha}"; do
            safe="${image//\//_}"
            safe="${safe//:/-}"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format sarif -o "trivy-reports/${safe}.sarif" "$image"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.trivy.outcome == 'success' || steps.trivy.outcome == 'failure'
        with:
          name: trivy-sarif
          path: trivy-reports
      - name: Đóng gói release
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sha="${DEPLOY_SHA}"
          docker save "hcn/api:${sha}" "hcn/web:${sha}" "hcn/postgres:18-${sha}" | zstd -T0 -o images.tar.zst
          git archive --format=tar -o bundle.tar "$sha" deploy db perf
          sha256sum images.tar.zst bundle.tar > manifest.sha256
          tar -cf release.tar manifest.sha256 images.tar.zst bundle.tar
      - name: Ghi khóa SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          umask 077
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
      - name: receive
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o BatchMode=yes \
            -p "${{ secrets.STAGING_SSH_PORT }}" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "receive ${DEPLOY_SHA}" < release.tar
      - name: deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o BatchMode=yes \
            -p "${{ secrets.STAGING_SSH_PORT }}" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "deploy ${DEPLOY_SHA}"
      - name: Khói qua Cloudflare
        id: smoke
        if: steps.gate.outputs.ready == 'true'
        env:
          APP_DOMAIN: ${{ vars.STAGING_APP_DOMAIN }}
          ID_DOMAIN: ${{ vars.STAGING_ID_DOMAIN }}
          STAGING_PROBE_TOKEN: ${{ secrets.STAGING_PROBE_TOKEN }}
          STAGING_SMOKE_HS_PASSWORD: ${{ secrets.STAGING_SMOKE_HS_PASSWORD }}
          STAGING_SMOKE_GV_PASSWORD: ${{ secrets.STAGING_SMOKE_GV_PASSWORD }}
        run: |
          set -euo pipefail
          bash deploy/staging/smoke-remote.sh
          if [[ -n "${STAGING_SMOKE_HS_PASSWORD}" && -n "${STAGING_SMOKE_GV_PASSWORD}" ]]; then
            pnpm install --frozen-lockfile
            pnpm exec playwright install --with-deps chromium
            BASE_URL="https://${APP_DOMAIN}" pnpm exec playwright test --config e2e/playwright.smoke.config.ts
          else
            echo "Chưa có mật khẩu khói. Curl đã chạy. Ops thêm secret sau lần seed đầu."
          fi
      - name: Rollback khi khói lỗi
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o BatchMode=yes \
            -p "${{ secrets.STAGING_SSH_PORT }}" \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            rollback
          exit 1
      - name: Xóa khóa SSH
        if: always()
        run: rm -f "$RUNNER_TEMP/ssh/id"
      - name: Nhắc ops
        if: steps.gate.outputs.ready != 'true'
        run: echo "Chưa deploy. Ops làm các bước trong docs/ops/staging-runbook.md rồi chạy lại workflow."
